[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-tool"
version = "0.1.0"
description = "Build evidence-based case files for automated decisions (email rejections, bank denials, etc.)"
requires-python = ">=3.10"

[project.optional-dependencies]
# Text from screenshots (OCR) and PDF letters, including scanned ones.
ocr = ["Pillow", "pypdf", "pypdfium2", "rapidocr_onnxruntime"]
# Only needed to regenerate tests/fixtures.
dev = ["reportlab"]

[project.scripts]
audit = "audit_tool.cli:main"

[tool.setuptools]
packages = ["audit_tool"]
