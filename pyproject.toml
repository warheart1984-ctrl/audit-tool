[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-tool"
version = "0.1.0"
description = "Build evidence-based case files for automated decisions (email rejections, bank denials, etc.)"
requires-python = ">=3.11"  # Pillow 13 (security floor for the OCR extra) needs 3.11+
license = { text = "MIT" }

[project.optional-dependencies]
# Text from screenshots (OCR) and PDF letters, including scanned ones.
# These parse untrusted files, so floors sit at releases with security fixes
# (Pillow 13.0 for JPEG/TIFF decoder hardening; pypdf 6.21.2 for CVE-2026-113786
# and the xref-table runtime advisories).
# No upper bounds: a ceiling on a parser blocks its next security release.
# CI tests against the latest versions on every push.
ocr = [
    "Pillow>=13.0.0",
    "pypdf>=6.21.2",
    "pypdfium2>=4.30.0",
    "rapidocr_onnxruntime>=1.3.24",
]
# Ed25519 entry signing (`audit keygen`, --key-file, --public-key).
sign = ["cryptography>=44.0.1"]
# Tests, and regenerating tests/fixtures.
dev = ["pytest>=8", "reportlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
audit = "audit_tool.cli:main"

[tool.setuptools]
packages = ["audit_tool"]
