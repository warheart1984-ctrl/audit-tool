[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-tool"
version = "0.1.0"
description = "Build evidence-based case files for automated decisions (email rejections, bank denials, etc.)"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
# Text from screenshots (OCR) and PDF letters, including scanned ones.
# These parse untrusted files, so floors sit at or above releases with known
# security fixes (Pillow 10.3 for CVE-2024-28219, pypdf 6.0 for CVE-2025-55197),
# and ceilings stop an untested major version arriving silently.
ocr = [
    "Pillow>=10.3.0,<13",
    "pypdf>=6.0.0,<7",
    "pypdfium2>=4.30.0,<6",
    "rapidocr_onnxruntime>=1.3.24,<2",
]
# Tests, and regenerating tests/fixtures.
dev = ["pytest>=8", "reportlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
audit = "audit_tool.cli:main"

[tool.setuptools]
packages = ["audit_tool"]
